<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f3f37">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%230e7a66'/%3E%3Crect x='9' y='29' width='8' height='10' rx='2' fill='%23f2c14e'/%3E%3Crect x='20' y='23' width='8' height='16' rx='2' fill='%23f2c14e'/%3E%3Crect x='31' y='16' width='8' height='23' rx='2' fill='%23f2c14e'/%3E%3Cpath d='M8 24.5l9.5-7.5 6 4 12-11M30 10h5.6v5.6' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="כלכלת המשפחה">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>ניתוח פיננסי משפחתי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Rubik:wght@500;600;700&display=swap">
<style>
/* Layout: right-hand rail of sections (drawer on phones) + a scrolling ledger of cards and tables. */
:root{
  --bg:#e8efeb; --surface:#ffffff; --surface-2:#f1f6f3; --ink:#0f211c; --muted:#566b64; --line:#d5e1dc;
  --accent:#0e7a66; --accent-ink:#ffffff; --accent-soft:#d6eee6; --gold:#c98a12; --gold-soft:#fbefd0;
  --spend:#bd6a1e; --spend-soft:#f8e6d3; --pos:#18804a; --pos-soft:#d9f0e2; --neg:#b9382f; --neg-soft:#f7dcd8; --warn:#9a6400;
  --rail-1:#0f3f37; --rail-2:#06231e; --rail-ink:#c9e0d8; --hero-1:#0f8a72; --hero-2:#0a4a40;
  --glow:rgba(14,122,102,.16);
  --shadow:0 1px 2px rgba(16,40,33,.05),0 10px 28px -16px rgba(16,40,33,.28);
  --f-display:"Rubik","Assistant",system-ui,sans-serif; --f-body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --radius:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1411; --surface:#12201c; --surface-2:#172925; --ink:#e3ede9; --muted:#8fa69e; --line:#22362f;
  --accent:#3cc4a8; --accent-ink:#04201a; --accent-soft:#163a33; --gold:#f0bd4f; --gold-soft:#3a2f14;
  --spend:#e7a25b; --spend-soft:#3a2a19; --pos:#4fcc89; --pos-soft:#15352a; --neg:#f0726a; --neg-soft:#3d1c1a; --warn:#e8b54c;
  --rail-1:#0c2a25; --rail-2:#050f0d; --rail-ink:#a9c4bb; --hero-1:#11765f; --hero-2:#073c33;
  --glow:rgba(60,196,168,.10);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a1411; --surface:#12201c; --surface-2:#172925; --ink:#e3ede9; --muted:#8fa69e; --line:#22362f;
  --accent:#3cc4a8; --accent-ink:#04201a; --accent-soft:#163a33; --gold:#f0bd4f; --gold-soft:#3a2f14;
  --spend:#e7a25b; --spend-soft:#3a2a19; --pos:#4fcc89; --pos-soft:#15352a; --neg:#f0726a; --neg-soft:#3d1c1a; --warn:#e8b54c;
  --rail-1:#0c2a25; --rail-2:#050f0d; --rail-ink:#a9c4bb; --hero-1:#11765f; --hero-2:#073c33;
  --glow:rgba(60,196,168,.10);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.6); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate;white-space:nowrap}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;box-shadow:var(--shadow);display:grid;gap:14px}
.login-card .mark{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 22px var(--f-display)}
.login-card h1{font-size:24px}
.login-card p{margin:0;color:var(--muted)}
label.field{display:grid;gap:4px;font-weight:600;font-size:13px;color:var(--muted)}
label.field input,label.field select,.inp{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 11px;font-size:15px;width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--neg)}
.btn[disabled]{opacity:.5;cursor:default}
.err{color:var(--neg);font-weight:600;min-height:1.4em;font-size:14px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
#rail{background:var(--surface);border-inline-start:0;border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 17px var(--f-display)}
.brand b{font:600 16px var(--f-display);display:block}
.brand small{color:var(--muted);font-size:12px}
.nav-btn{display:flex;align-items:center;gap:10px;text-align:start;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent)}
.nav-btn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail-foot{margin-top:auto;display:grid;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
main{min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 24px;flex-wrap:wrap}
#topbar h2{font-size:27px;font-weight:700;margin-inline-end:auto;letter-spacing:-.015em}
#menuBtn{display:none}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.demo-btn{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.pill.demo{background:var(--spend-soft);color:var(--spend)}
.pill.dirty{background:var(--neg-soft);color:var(--neg)}
.pill.ok{background:var(--pos-soft);color:var(--pos)}
.pill.muted{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
#page{padding:20px 24px 48px;display:grid;gap:18px;min-width:0}
.yearsel{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--muted);font-size:13px}
.yearsel select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:700;color:var(--ink)}
.edit-on .btn.edit{background:var(--spend-soft);border-color:var(--spend);color:var(--spend)}

/* ---------- content ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;gap:2px;min-width:0}
.kpi .lbl{font-size:13px;color:var(--muted);font-weight:600}
.kpi .val{font:600 24px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero .lbl,.kpi.hero .sub{color:inherit;opacity:.85}
.up{color:var(--pos)} .down{color:var(--neg)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.grid21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
.chart.pie{height:330px}
.grid-assets{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px}
.donut-row{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:18px;align-items:center}
.grid2>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.card-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:16px;margin-inline-end:auto}
.card-h .hint{color:var(--muted);font-size:12.5px}
.chart{position:relative;height:300px}
.chart.tall{height:360px}
.chart.short{height:240px}
.note{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;color:var(--muted);font-size:13.5px}
.note b{color:var(--ink)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
thead th{background:var(--surface-2);font-weight:700;color:var(--muted);font-size:12.5px;position:sticky;top:0;z-index:1}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.sticky-col{position:sticky;inset-inline-start:0;background:var(--surface);z-index:2;max-width:260px;overflow:hidden;text-overflow:ellipsis}
thead .sticky-col{background:var(--surface-2);z-index:3}
tr.grp td{background:var(--surface-2);font-weight:700;cursor:pointer}
tr.grp td.sticky-col{background:var(--surface-2)}
tr.grp .caret{display:inline-block;transition:transform .15s;margin-inline-end:4px;color:var(--muted)}
tr.grp.closed .caret{transform:rotate(90deg)}
tr.total td{font-weight:700;background:var(--accent-soft);color:var(--ink)}
tr.total td.sticky-col{background:var(--accent-soft)}
td.zero{color:color-mix(in srgb,var(--muted) 55%,transparent)}
.chip{display:inline-block;border-radius:6px;padding:0 6px;font-size:11px;font-weight:700;margin-inline-start:6px;vertical-align:1px}
.chip.fixed{background:var(--accent-soft);color:var(--accent)}
.chip.var{background:var(--spend-soft);color:var(--spend)}
.chip.yes{background:var(--pos-soft);color:var(--pos)}
.chip.no{background:var(--neg-soft);color:var(--neg)}
button.chip{border:0;cursor:pointer}
td input.cell{width:92px;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:3px 6px;text-align:end;font-variant-numeric:tabular-nums}
td input.cell.wide{width:180px;text-align:start}
td select.cell{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:3px 6px}
td input.cell:focus{border-color:var(--accent);background:var(--surface)}
.legend-list{display:grid;gap:6px}
.legend-row{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;font-size:14px}
.legend-row .sw{width:12px;height:12px;border-radius:3px}
.legend-row .pct{color:var(--muted);font-size:12.5px;min-width:44px;text-align:end}
.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:6px}
.contact b{font:600 16px var(--f-display)}
.contact .topic{color:var(--muted);font-size:13.5px;white-space:pre-line}
.contact .phone{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.contact .notes{font-size:13px;color:var(--warn)}
.risk-person{font:600 14px var(--f-display)}
.prem{display:block;color:var(--muted);font-size:11.5px}
.savebar{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);z-index:40;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.savebar .btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-start:50%;transform:translateX(50%);z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}

/* ---------- settings drawer ---------- */
#settings{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-start}
#settings .scrim{position:absolute;inset:0;background:rgba(0,0,0,.35)}
#settings .panel{position:relative;width:min(460px,100%);height:100%;overflow:auto;background:var(--bg);border-inline-end:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
#settings h3{font-size:15px}
.set-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
.set-sec p{margin:0;color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>label.field{flex:1;min-width:120px}

@media (max-width: 900px){
  .grid2,.grid21,.grid-assets{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 760px){
  #app{grid-template-columns:minmax(0,1fr)}
  #rail{position:fixed;inset-block:0;inset-inline-start:0;width:260px;z-index:45;transform:translateX(100%);visibility:hidden;transition:transform .2s,visibility .2s;height:100%;padding-top:calc(18px + env(safe-area-inset-top,0px));box-shadow:var(--shadow)}
  body.nav-open #rail{transform:none;visibility:visible}
  body.nav-open #scrim{display:block}
  #menuBtn{display:inline-flex}
  #topbar{padding:8px 16px;top:env(safe-area-inset-top,0px)}
  #topbar h2{font-size:22px}
  #page{padding:14px 16px 90px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .kpi.hero{grid-column:1/-1}
  .kpi .val{font-size:18px}
  .kpi .sub{font-size:12px}
  .chart{height:250px} .chart.tall{height:290px}
  .hide-sm{display:none}
  .donut-row{grid-template-columns:minmax(0,1fr)}
  .donut-row .chart{height:280px}
}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:44}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- visual layer: forest-green rail, soft glow ground, gold for growth ---------- */
body{background:radial-gradient(900px 420px at 100% -8%,var(--glow),transparent 70%),radial-gradient(700px 380px at 0% 100%,var(--glow),transparent 70%),var(--bg);background-attachment:fixed}
.logo{width:38px;height:38px;flex:none;display:block}
.logo.lg{width:56px;height:56px}
#rail{background:linear-gradient(180deg,var(--rail-1),var(--rail-2));border-inline-end:0;color:var(--rail-ink)}
#rail .brand b{color:#fff}
#rail .brand small{color:var(--rail-ink);opacity:.8}
#rail .brand .sub{display:block;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.02em}
#rail .nav-btn{color:var(--rail-ink)}
#rail .nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}
#rail .nav-btn.active{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset -3px 0 0 var(--gold)}
#rail .rail-foot{border-top-color:rgba(255,255,255,.1)}
.nav-sec{margin:14px 10px 4px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--muted)}
#rail .nav-sec{border-top-color:rgba(255,255,255,.1);color:var(--gold)}
details>summary{cursor:pointer}
#topbar{background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom-color:transparent}
.card,.kpi,.contact,.set-sec{border-color:color-mix(in srgb,var(--line) 70%,transparent);box-shadow:var(--shadow)}
.kpi{position:relative;overflow:hidden}
.kpi .lbl{display:flex;align-items:center;gap:6px}
.kpi .lbl:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.7;flex:none}
.kpi.hero{background:linear-gradient(135deg,var(--hero-1),var(--hero-2));border:0;color:#fff}
.kpi.hero .lbl:before{background:var(--gold);opacity:1}
.kpi.hero:after{content:"";position:absolute;inset-inline-start:-30px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.28),transparent 65%);pointer-events:none}
.kpi.hero .val{color:#fff}
thead th{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface));color:color-mix(in srgb,var(--accent) 60%,var(--ink))}
thead .sticky-col{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.btn.primary{background:linear-gradient(135deg,var(--hero-1),var(--hero-2));border-color:transparent;color:#fff}
.card-h h3{display:flex;align-items:center;gap:8px}
.card-h h3:before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--gold),var(--accent))}
body.edit-on .sticky-col{max-width:none}
body.edit-on td input.cell.wide{width:170px}
.rate-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:10px;padding:6px 14px;font-size:13.5px;box-shadow:var(--shadow)}
.rate-strip .rs-lbl{font-weight:700;color:var(--muted)}
.rate-strip .num{font-weight:700;font-family:var(--f-display)}
.rate-strip .rs-dot{color:var(--muted)}
.rate-strip .rs-hint{color:var(--muted);font-size:12.5px;margin-inline-start:auto}
.rate-strip .btn{color:var(--accent);padding:2px 8px}
@media (max-width:760px){.rate-strip .rs-hint{display:none}.rate-strip .btn{margin-inline-start:auto}}
.retire-top .field{min-width:150px;flex:1}
.retire-top .field.big{flex:2;min-width:240px}
.retire-top .big-inp{font:700 26px var(--f-display);padding:8px 12px;color:var(--accent)}
.kpi .info-btn{position:absolute;top:10px;inset-inline-end:10px;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;background:transparent;color:var(--muted);font:800 12px/1 var(--f-display);cursor:pointer;display:grid;place-items:center;padding:0;opacity:.75;z-index:2}
.kpi .info-btn:hover,.kpi .info-btn.on{opacity:1;color:var(--accent);background:var(--accent-soft)}
.kpi.hero .info-btn{color:#fff}
.kpi.hero .info-btn:hover,.kpi.hero .info-btn.on{background:rgba(255,255,255,.2);color:#fff}
.info-panel{border:1.5px solid var(--accent)}
.info-p{margin:0;font-size:14px;line-height:1.6}
tr.pctrow td{font-size:12px;color:var(--muted);padding-block:4px}
td.x-col{width:28px;padding-inline:4px}
.xbtn{border:0;background:var(--neg-soft);color:var(--neg);font-weight:700;margin-inline-end:6px;cursor:pointer;width:24px;height:24px;border-radius:6px;font-size:15px;line-height:1;display:inline-grid;place-items:center}
.xbtn:hover{background:var(--neg);color:#fff}
.toast .undo{margin-inline-start:10px;background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:1px 8px;cursor:pointer;font-weight:700}
.contact{grid-template-columns:auto 1fr;column-gap:12px;align-items:start}
.contact>*:not(.c-ico){grid-column:2}
.c-ico{grid-row:1/span 4;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.c-ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.c-ico.gold{background:var(--gold-soft);color:var(--gold)}
.c-ico.blue{background:color-mix(in srgb,#3c64b1 18%,var(--surface));color:#4a73c4}
/* login */
#login{background:radial-gradient(800px 500px at 80% 0%,rgba(240,189,79,.18),transparent 60%),linear-gradient(160deg,var(--rail-1),var(--rail-2))}
.login-card{border:0;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.login-brand{display:flex;align-items:center;gap:12px}
.login-brand small{display:block;color:var(--gold);font-weight:700;font-size:13px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="lgBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15a083"/><stop offset="1" stop-color="#0a4a40"/></linearGradient>
  <linearGradient id="lgGold" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e09a1f"/><stop offset="1" stop-color="#ffd978"/></linearGradient>
  <symbol id="logo" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="13" fill="url(#lgBg)"/>
    <rect x="9" y="29" width="8" height="10" rx="2.2" fill="url(#lgGold)" opacity=".75"/>
    <rect x="20" y="23" width="8" height="16" rx="2.2" fill="url(#lgGold)" opacity=".88"/>
    <rect x="31" y="16" width="8" height="23" rx="2.2" fill="url(#lgGold)"/>
    <path d="M8 24.5l9.5-7.5 6 4 12-11" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 10h5.6v5.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol></defs></svg>

<section id="login">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-brand"><svg class="logo lg"><use href="#logo"/></svg><div><h1>ניתוח פיננסי משפחתי</h1><small>הכנסות · הוצאות · צמיחה</small></div></div>
    <p>הכניסה מוגנת בסיסמה. הנתונים מוצפנים ונפתחים רק במכשיר שלך.</p>
    <label class="field">משתמש
      <input id="user" name="username" autocomplete="username" value="family" required>
    </label>
    <label class="field">סיסמה
      <input id="pass" name="password" type="password" autocomplete="current-password" required>
    </label>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn primary" id="loginBtn" type="submit">כניסה</button>
    <div class="divider">או</div>
    <button class="btn demo-btn" type="button" id="demoBtn">כניסה - דמו</button>
    <p style="font-size:12.5px">הדמו מציג את אותם מסכים עם שמות ומספרים בדויים.</p>
  </form>
</section>

<div id="app" hidden>
  <nav id="rail" aria-label="ניווט">
    <div class="brand"><svg class="logo"><use href="#logo"/></svg><div><b id="familyLbl">המשפחה שלנו</b><span class="sub">ניתוח פיננסי</span><small id="updatedLbl"></small></div></div>
    <div id="nav"></div>
    <div class="rail-foot">
      <button class="nav-btn" id="settingsBtn" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>הגדרות</button>
      <button class="nav-btn" id="logoutBtn" type="button"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>יציאה</button>
    </div>
  </nav>
  <div id="scrim"></div>
  <main>
    <header id="topbar">
      <button class="btn ghost" id="menuBtn" type="button" aria-label="תפריט"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h2 id="pageTitle"></h2>
      <span id="modePill"></span>
      <label class="yearsel" id="yearWrap" hidden>שנה <select id="yearSel"></select></label>
      <button class="btn small edit" id="editBtn" type="button">✎ עריכה</button>
    </header>
    <div id="page"></div>
  </main>
</div>

<div id="settings" hidden>
  <div class="scrim" data-close></div>
  <div class="panel" id="settingsPanel"></div>
</div>
<div class="savebar" id="savebar" hidden><span>יש שינויים שלא נשמרו</span><button class="btn small" id="saveBtn" type="button">שמירה</button></div>
<div class="toast" id="toast" hidden></div>

<script src="vendor/chart.umd.js"></script>

</body>
